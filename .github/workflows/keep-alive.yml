name: Supabase Keep Alive

on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check both databases
        id: check
        continue-on-error: true
        env:
          ROTA_SUPABASE_URL: ${{ secrets.ROTA_SUPABASE_URL }}
          ROTA_SERVICE_ROLE_KEY: ${{ secrets.ROTA_SERVICE_ROLE_KEY }}
          TSR_SUPABASE_URL: ${{ secrets.TSR_SUPABASE_URL }}
          TSR_SERVICE_ROLE_KEY: ${{ secrets.TSR_SERVICE_ROLE_KEY }}
        run: python check.py

      - name: Publish dashboard status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update heartbeat status"
            git push
          fi

      - name: Report failed checks
        if: steps.check.outcome == 'failure'
        run: exit 1
